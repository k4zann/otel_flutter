# Copy of /otel-lgtm/otelcol-config.yaml from grafana/otel-lgtm:0.36.0 with
# one addition, the `transform/event_name` processor in the logs pipeline.
# Loki drops the OTLP log event name, so otel_flutter's events (session.start,
# app.jank, app.crash, ...) would arrive nameless; this copies the name into
# the `event.name` attribute, which Loki keeps as `event_name`. Events also
# have no body, and Loki shows the body as the log line, so events without
# one get a short readable line built from the name and key attributes.
# Refresh this file from the image whenever the image tag changes.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:
  transform/event_name:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - log.event_name != ""
        statements:
          - set(log.attributes["event.name"], log.event_name)
          # Most specific first: each one fills the body only while it is empty.
          - set(log.body, Format("%s %s", [log.event_name, log.attributes["ios.app.state"]])) where log.body == nil and log.attributes["ios.app.state"] != nil
          - set(log.body, Format("%s %s", [log.event_name, log.attributes["android.app.state"]])) where log.body == nil and log.attributes["android.app.state"] != nil
          - set(log.body, Format("%s %s %.2fs", [log.event_name, log.attributes["flutter.jank.source"], log.attributes["app.jank.period"]])) where log.body == nil and log.attributes["flutter.jank.source"] != nil and log.attributes["app.jank.period"] != nil
          - set(log.body, log.event_name) where log.body == nil

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces]
      #exporters: [otlp_http/traces,debug/traces]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [batch]
      exporters: [otlp_http/metrics]
      #exporters: [otlp_http/metrics,debug/metrics]
    logs:
      receivers: [otlp]
      processors: [transform/event_name, batch]
      exporters: [otlp_http/logs]
      #exporters: [otlp_http/logs,debug/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]

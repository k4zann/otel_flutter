# Copy of /otel-lgtm/loki-config.yaml from grafana/otel-lgtm:0.36.0 with one
# addition, `limits_config.otlp_config`. By default Loki turns only a few
# OTLP resource attributes into labels (service_name,
# deployment_environment_name, service_instance_id); everything else is
# structured metadata, which Grafana's Logs Drilldown does not offer as a
# label. These attributes have few distinct values, so they are safe labels.
# Refresh this file from the image whenever the image tag changes.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://127.0.0.1:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false

limits_config:
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service.version
            - os.name
    log_attributes:
      # Set by the collector from the OTLP event name (otelcol-config.yaml).
      - action: index_label
        attributes:
          - event.name

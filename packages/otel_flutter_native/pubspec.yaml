name: otel_flutter_native
description: "Native crash, ANR and exit-reason reporting for otel_flutter (Android ApplicationExitInfo, iOS MetricKit)."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  otel_flutter:
    path: ../..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: kz.mystartups.otel_flutter_native
        pluginClass: OtelFlutterNativePlugin
      ios:
        pluginClass: OtelFlutterNativePlugin
